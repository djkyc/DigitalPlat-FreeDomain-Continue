name: DigitalPlat 域名自动续期 (有头浏览器破盾版)

on:
  schedule:
    # 北京时间每天上午 10:23 运行（故意错开整点防风控）
    - cron: '23 2 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 安装虚拟桌面及 Chromium 核心依赖
      - name: Install Xvfb and system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgbm-dev libasound2 libtinfo5

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install patchright requests

      # 强力安装标准 Chromium 内核
      - name: Install patchright Chromium
        run: |
          python -m patchright install chromium --with-deps

      # 使用 Xvfb 虚拟环境伪装 1080P 真实显示器运行
      - name: Run renew script
        env:
          DP_ACCOUNTS:        ${{ secrets.DP_ACCOUNTS }}
          DP_EMAIL:           ${{ secrets.DP_EMAIL }}
          DP_PASSWORD:        ${{ secrets.DP_PASSWORD }}
          BARK_KEY:           ${{ secrets.BARK_KEY }}
          BARK_SERVER:        ${{ secrets.BARK_SERVER }}
          ENABLE_TELEGRAM:    ${{ secrets.ENABLE_TELEGRAM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python renew.py

      # 现场留存！如果卡盾或者失败，去 GitHub Actions 页面下载 zip 压缩包看现场截图
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-debug-screenshots-${{ github.run_id }}
          retention-days: 7
          path: |
            *.png
            *.html
