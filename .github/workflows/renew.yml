name: DigitalPlat 域名自动续期

on:
  schedule:
    # 每天 UTC 02:23 运行（北京时间 10:23）
    # 错开整点可以有效降低被 Cloudflare 自动化风控策略拦截的概率
    - cron: '23 2 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装 Xvfb 及浏览器所需的底层核心依赖
      - name: Install Xvfb and system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgbm-dev libasound2 libtinfo5

      # 4. 安装 Python 依赖库
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install patchright requests

      # 5. 安装 patchright 专属的 Chromium 内核及其全量系统依赖
      - name: Install patchright Chromium
        run: |
          python -m patchright install chromium --with-deps

      # 6. 在虚拟桌面环境下运行续期脚本
      - name: Run renew script
        env:
          DP_ACCOUNTS:        ${{ secrets.DP_ACCOUNTS }}
          DP_EMAIL:           ${{ secrets.DP_EMAIL }}
          DP_PASSWORD:        ${{ secrets.DP_PASSWORD }}
          BARK_KEY:           ${{ secrets.BARK_KEY }}
          BARK_SERVER:        ${{ secrets.BARK_SERVER }}
          ENABLE_WECHAT:      ${{ secrets.ENABLE_WECHAT }}
          WECHAT_API_URL:     ${{ secrets.WECHAT_API_URL }}
          WECHAT_AUTH_TOKEN:  ${{ secrets.WECHAT_AUTH_TOKEN }}
          ENABLE_TELEGRAM:    ${{ secrets.ENABLE_TELEGRAM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python renew.py

      # 7. 无论成功与否，一律上传运行截图和 JSON 报告，极大方便在面板查看卡盾现场
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-artifacts-${{ github.run_id }}
          retention-days: 7
          path: |
            *.png
            *.html
            *.json
