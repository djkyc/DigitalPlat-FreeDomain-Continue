name: Domain Renewal

于:
  schedule:
    - cron: '0 0 1 */3 *'   # 每季度第一天 UTC 0点运行（北京时间 8点）
  workflow_dispatch:          # 支持手动触发
name: DigitalPlat 域名自动续期

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装 Xvfb（虚拟显示，让 headless=False 的 Chromium 能跑起来）
      - name: Install Xvfb and dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgbm-dev

      # 4. 安装 Python 依赖
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install patchright requests

      # 5. 安装 patchright 的 Chromium（必须单独安装，和 playwright 不共用）
      - name: Install patchright Chromium
        run: |
          patchright install chromium --with-deps

      # 6. 运行续期脚本（用 xvfb-run 包一层，提供虚拟显示给 headless=False 的 Chromium）
      - name: Run renew script
        env:
          DP_ACCOUNTS:        ${{ secrets.DP_ACCOUNTS }}
          BARK_KEY:           ${{ secrets.BARK_KEY }}
          BARK_SERVER:        ${{ secrets.BARK_SERVER }}
          ENABLE_WECHAT:      ${{ secrets.ENABLE_WECHAT }}
          WECHAT_API_URL:     ${{ secrets.WECHAT_API_URL }}
          WECHAT_AUTH_TOKEN:  ${{ secrets.WECHAT_AUTH_TOKEN }}
          ENABLE_TELEGRAM:    ${{ secrets.ENABLE_TELEGRAM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python renew.py

      # 7. 上传所有截图和结果文件（无论成功失败都上传，方便排查）
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-artifacts-${{ github.run_id }}
          retention-days: 7
          path: |
            *.png
            *.html
            *.json
